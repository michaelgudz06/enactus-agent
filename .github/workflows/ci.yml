name: CI

# Every check here must pass with NO credentials. The app reads Supabase and
# OpenRouter keys from the environment; none of them are available to CI and
# none may be added. `vitest.config.mts` pins SUPABASE_SERVICE_ROLE_KEY to ""
# so the suite structurally cannot reach the live project.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A superseded push should not keep burning a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # No `engines` field, no `.nvmrc`, and no Vercel project exists for this repo,
  # so there is no configured runtime to inherit. 22.x is the active LTS that
  # satisfies every dependency (next >=20.9.0, vitest ^20 || ^22 || >=24) and
  # matches the version the project is actually developed on.
  # If this app is ever deployed, align this with the deployment's Node version.
  NODE_VERSION: "22.x"

jobs:
  # Four separate jobs, not one job with four steps, deliberately: each reports
  # its own check so a failure names the thing that broke, and no one job's
  # failure can mask a genuine regression in another.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Restored before `npm ci` so the glob below cannot match node_modules.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run build

  # Green. The two react-hooks/set-state-in-effect errors this job was added
  # red for are fixed; nothing is silenced or ignored to keep it that way, and
  # weakening the config to hide a future one would defeat the point of the job.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
