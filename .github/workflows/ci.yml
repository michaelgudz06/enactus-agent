name: CI

# Every check here must pass with NO credentials. The app reads its Neon,
# OpenRouter, Apollo and Google keys from the environment; none of them are
# available to CI and none may be added. Nothing below touches the network at
# runtime, so the suite structurally cannot reach the live database.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A superseded push should not keep burning a runner.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches the Node version the Vercel project builds on. Keep the two aligned:
  # a green build here that fails on deploy is worse than no CI at all.
  NODE_VERSION: "22.x"

jobs:
  # Four separate jobs, not one job with four steps, deliberately: each reports
  # its own check so a failure names the thing that broke.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Two suites, deliberately. `npm run check` is the selfcheck: plain assertions
  # run under --experimental-strip-types, which is why the libraries it covers
  # carry no static imports (see scripts/selfcheck.ts). `npm test` is vitest,
  # which covers the alumni-roster parser. Neither reaches the network.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # Restored before `npm ci` so the glob below cannot match node_modules.
      - name: Cache Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'next.config.ts', 'tsconfig.json', 'postcss.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm run build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
