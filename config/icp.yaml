# ---------------------------------------------------------------------------
# Affiliation evidence, the G_AFFILIATION_EVIDENCE gate. S6 only.
# One tier-1 source, OR two independent tier-2/3 sources on DIFFERENT domains, AND the
# literal string present in retrieved text. Semantic search cannot enforce an institutional
# affiliation — a "Simon Fraser" people query returned Sim / Simon / Simran / Harsimrat.
# ---------------------------------------------------------------------------
affiliation_evidence:
  tier1_domains: [sfu.ca, enactussfu.ca, enactussfu.com, enactus.ca]
  tier2_domains: [bcbusiness.ca, techcouver.com, dailyhive.com, vancouverisawesome.com, betakit.com]
  min_tier1_sources: 1
  min_tier2_sources: 2 # and they must be on different registrable domains
  require_literal_substring: true
